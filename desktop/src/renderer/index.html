<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP restritiva: o painel é 100% local e não busca script de lugar nenhum.
      `connect-src` precisa alcançar a API do PikPok (SSE incluso) e nada mais.
      Ajuste a origem ao trocar de ambiente, mas não relaxe para `*`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.pikpok.com.br http://localhost:3000"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PikPok Copiloto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
